Builds:
  - versionName: 1.5.3
    versionCode: 10
    commit: 0ce63b7f53970957d1fbcf94f5d42451aada93cc
    subdir: android
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - yes
    prebuild:
      - npm ci --prefix=..
      - sed -i '/jvmToolchain/s/17/21/' ../node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g' ../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scandelete:
      - node_modules
    scanignore:
      - node_modules/expo-asset/local-maven-repo
      - node_modules/@expo/dom-webview/local-maven-repo
      - node_modules/expo-file-system/local-maven-repo
      - node_modules/expo-font/local-maven-repo
      - node_modules/expo-keep-awake/local-maven-repo
      - node_modules/expo-linking/local-maven-repo
      - node_modules/expo-localization/local-maven-repo
      - node_modules/expo-router/local-maven-repo
      - node_modules/expo-secure-store/local-maven-repo
      - node_modules/expo-status-bar/local-maven-repo
      - node_modules/@expo/ui/local-maven-repo
      - node_modules/hermes-compiler/hermesc
      - node_modules/fb-dotslash/bin
      - node_modules/react-native/React/I18n/strings
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/@react-native/masked-view/masked-view/android/build.gradle

